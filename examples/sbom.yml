name: Generate SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        id: da
        uses: trustification/trustify-da-action@main
        with:
          mode: sbom

      - name: Upload SBOM artifact
        if: steps.da.outputs.sbom-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ steps.da.outputs.sbom-path }}
