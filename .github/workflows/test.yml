name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [remediate, check, sbom]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run action - ${{ matrix.mode }} mode
        uses: ./
        with:
          mode: ${{ matrix.mode }}
          sources: test/fixtures/pom.xml,test/fixtures/libs.versions.toml
          dry-run: 'true'
        continue-on-error: true

  test-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Maven fixture
        run: |
          if ! grep -q '<groupId>' test/fixtures/pom.xml; then
            echo "Invalid pom.xml fixture"
            exit 1
          fi

      - name: Verify Gradle fixture
        run: |
          if ! grep -q '\[versions\]' test/fixtures/libs.versions.toml; then
            echo "Invalid libs.versions.toml fixture"
            exit 1
          fi
